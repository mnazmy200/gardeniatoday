<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gardenia Market - All your services in one place">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gardeniamarket">

  <!-- هذا هو الـ placeholder الذي يحتاجه Flutter لضبط المسار الأساسي -->
  <base href="/gardeniatoday/">
  <!-- تم تعديل المسارات لتصبح نسبية (بدون "/" في البداية) -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>جاردينيا توداي</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/promise-polyfill@8/dist/polyfill.min.js"></script>
  <!-- Load Firebase scripts upfront -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>

  <!-- VAPID Public Key and Push Utilities -->
  <script>
    // Utility to load scripts with error handling
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.onload = () => {
          console.log(`DEBUG: Successfully loaded script: ${src} at ${new Date().toISOString()}`);
          resolve();
        };
        script.onerror = () => {
          console.error(`DEBUG: Failed to load script: ${src} at ${new Date().toISOString()}`);
          reject(new Error(`Failed to load script: ${src}`));
        };
        document.head.appendChild(script);
      });
    }

    // Initialize Firebase with error handling
    try {
      const firebaseConfig = {
        apiKey: "AIzaSyCBWrU8jvaMjrachP9amOX1zJ-KavEPTjo",
        authDomain: "gardeniatodaynew.firebaseapp.com",
        projectId: "gardeniatodaynew",
        storageBucket: "gardeniatodaynew.firebasestorage.app",
        messagingSenderId: "805080687276",
        appId: "1:805080687276:web:8cfa2db1884f916b1ff509",
        measurementId: "G-6V2JS7ZN1F"
      };
      firebase.initializeApp(firebaseConfig);
      console.log(`[Main] Firebase initialized in main app at ${new Date().toISOString()}`);
    } catch (e) {
      console.error(`[Main] Error initializing Firebase: ${e} at ${new Date().toISOString()}`);
    }

    // Attach VAPID key to window
    window.VAPID_PUBLIC_KEY = 'BJpxFKoSTkM79BXFlIVkilw57nctbllWpNKNqFVTxxoltNdNPSvDMDJCdQm0bx6iWylv1mmfFNKsWsAtR_KGSuo';
    console.log(`[Push] VAPID_PUBLIC_KEY initialized: ${window.VAPID_PUBLIC_KEY} at ${new Date().toISOString()}`);

    // Utility to convert base64url string to Uint8Array (needed for VAPID)
    window.urlBase64ToUint8Array = function(base64String) {
      console.log(`[Push] urlBase64ToUint8Array called with: ${base64String} at ${new Date().toISOString()}`);
      if (!base64String || typeof base64String !== 'string') {
        console.error(`[Push] Error: base64String is invalid or undefined at ${new Date().toISOString()}`);
        throw new Error('Invalid VAPID public key: input is not a string');
      }
      try {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding)
          .replace(/\-/g, '+')
          .replace(/_/g, '/');
        console.log(`[Push] Normalized base64 string: ${base64} at ${new Date().toISOString()}`);
        const rawData = window.atob(base64);
        console.log(`[Push] Raw data length: ${rawData.length} at ${new Date().toISOString()}`);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
          outputArray[i] = rawData.charCodeAt(i);
        }
        console.log(`[Push] Uint8Array created at ${new Date().toISOString()}`);
        return outputArray;
      } catch (e) {
        console.error(`[Push] Error in urlBase64ToUint8Array: ${e} at ${new Date().toISOString()}`);
        throw e;
      }
    };

    // Register the service worker for push notifications
    async function registerPushServiceWorker() {
      try {
        console.log(`[Push] Registering service worker at ${new Date().toISOString()}`);

        // استخدام مسار نسبي (بدون "/" في البداية)
        const swPath = 'firebase-messaging-sw.js';
        const scope = './';  // مسار نسبي

        // Unregister only relevant service workers
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (let reg of registrations) {
          if (reg.scope.includes(window.location.pathname) || reg.active?.scriptURL.includes('firebase-messaging-sw.js')) {
            console.log(`[Push] Existing service worker scope: ${reg.scope} at ${new Date().toISOString()}`);
            await reg.unregister();
            console.log(`[Push] Unregistered service worker at scope: ${reg.scope} at ${new Date().toISOString()}`);
          }
        }

        // Register the service worker
        const registration = await navigator.serviceWorker.register(swPath, { scope: scope });
        console.log(`[Push] Service worker registered at: ${swPath} with scope: ${registration.scope} at ${new Date().toISOString()}`);

        // Wait for the service worker to be ready
        await navigator.serviceWorker.ready;
        console.log(`[Push] Service worker is ready at ${new Date().toISOString()}`);

        // Use Firebase Messaging
        const messaging = firebase.messaging();
        console.log(`[Push] Firebase Messaging initialized at ${new Date().toISOString()}`);

        // Handle foreground messages
        messaging.onMessage((payload) => {
          console.log(`[Push] Foreground message received: ${JSON.stringify(payload)} at ${new Date().toISOString()}`);
          const notification = payload.notification || {};
          const notificationTitle = notification.title || 'Default Title';
          const notificationOptions = {
            body: notification.body || 'Default Body',
            icon: "icons/Icon-192.png", // مسار نسبي
            data: payload.data || {}
          };
          console.log(`[Push] Showing foreground notification: ${notificationTitle}, ${notificationOptions.body} at ${new Date().toISOString()}`);
          registration.showNotification(notificationTitle, notificationOptions);
        });
      } catch (e) {
        console.error(`[Push] Error registering service worker: ${e} at ${new Date().toISOString()}`);
      }
    }

    // Check if service workers are supported and register
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        registerPushServiceWorker();
      });
    } else {
      console.warn(`[Push] Service workers are not supported in this browser at ${new Date().toISOString()}`);
    }

    // Force splash screen removal with error message if flutter-first-frame doesn't fire
    window.addEventListener('load', () => {
      console.log(`DEBUG: Window load event fired at ${new Date().toISOString()}`);
      setTimeout(async () => {
        const splash = document.getElementById('splash');
        if (splash) {
          try {
            // Perform a network check (باستخدام مسار نسبي)
            const response = await fetch('ping', { method: 'HEAD', cache: 'no-store' });
            if (!response.ok) throw new Error('Network issue');
            console.warn(`DEBUG: Forcing splash screen removal due to timeout at ${new Date().toISOString()}`);
            splash.innerHTML = `
              <div style="text-align: center; color: white; direction: rtl;">
                <p style="font-family: 'Cairo', sans-serif; font-size: 24px; font-weight: bold;">فشل تحميل التطبيق</p>
                <p style="font-family: 'Cairo', sans-serif; font-size: 16px; margin: 8px 0;">يرجى المحاولة لاحقاً</p>
                <button onclick="window.location.reload()" style="padding: 10px 20px; background: #F59E0B; border: none; border-radius: 5px; color: white; font-family: 'Cairo', sans-serif; font-size: 16px;">إعادة المحاولة</button>
              </div>
            `;
            splash.classList.add('hidden');
            setTimeout(() => {
              splash.remove();
              console.log(`DEBUG: Splash screen removed due to timeout at ${new Date().toISOString()}`);
            }, 1000);
          } catch (e) {
            console.error(`DEBUG: Network check failed: ${e} at ${new Date().toISOString()}`);
            splash.innerHTML = `
              <div style="text-align: center; color: white; direction: rtl;">
                <p style="font-family: 'Cairo', sans-serif; font-size: 24px; font-weight: bold;">فشل تحميل التطبيق</p>
                <p style="font-family: 'Cairo', sans-serif; font-size: 16px; margin: 8px 0;">يرجى التحقق من الاتصال بالإنترنت</p>
                <button onclick="window.location.reload()" style="padding: 10px 20px; background: #F59E0B; border: none; border-radius: 5px; color: white; font-family: 'Cairo', sans-serif; font-size: 16px;">إعادة المحاولة</button>
              </div>
            `;
            splash.classList.add('hidden');
            setTimeout(() => {
              splash.remove();
              console.log(`DEBUG: Splash screen removed due to network failure at ${new Date().toISOString()}`);
            }, 1000);
          }
        }
      }, 15000); // Increased to 15 seconds
    });

    // Debug flutter-first-frame event
    window.addEventListener('flutter-first-frame', function () {
      console.log(`DEBUG: flutter-first-frame event fired at ${new Date().toISOString()}`);
      const splash = document.getElementById('splash');
      if (splash) {
        console.log(`DEBUG: Hiding splash screen at ${new Date().toISOString()}`);
        splash.classList.add('hidden');
        setTimeout(() => {
          console.log(`DEBUG: Removing splash screen at ${new Date().toISOString()}`);
          splash.remove();
        }, 1000);
      } else {
        console.warn(`DEBUG: Splash screen element not found at ${new Date().toISOString()}`);
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #FEFCE8;
      font-family: 'Cairo', sans-serif;
    }
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #065F46 0%, #F59E0B 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      transition: opacity 1s ease-out, transform 0.5s ease-out;
      direction: rtl;
      overflow: hidden;
    }
    #splash.hidden {
      opacity: 0;
      transform: scale(1.1);
      pointer-events: none;
    }
    #splash::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path fill="rgba(255,255,255,0.05)" d="M0 0h100v50c-25 25-50 25-75 0S0 25 0 0z"/></svg>') no-repeat bottom;
      background-size: cover;
      animation: subtleWave 10s infinite ease-in-out;
    }
    @keyframes subtleWave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(20px); }
    }
    #splash .logo-container {
      position: relative;
      animation: logoFadeIn 1.2s ease-out forwards;
    }
    #splash .logo {
      width: 200px;
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
      animation: logoPulse 2.5s infinite ease-in-out;
    }
    @keyframes logoFadeIn {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    #splash .text-container {
      text-align: center;
      margin-top: 20px;
      animation: textFadeIn 1.5s ease-out 0.3s forwards;
      opacity: 0;
    }
    @keyframes textFadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    #splash .app-name {
      font-family: 'Cairo', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      color: #FEFCE8;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
      margin: 0;
      letter-spacing: 1px;
    }
    #splash .tagline {
      font-family: 'Cairo', sans-serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: #E6FFF4;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      margin-top: 8px;
    }
    #splash .particle-loader {
      position: absolute;
      bottom: 10%;
      display: flex;
      gap: 15px;
      perspective: 1000px;
    }
    #splash .particle-loader .particle {
      width: 14px;
      height: 14px;
      background: linear-gradient(45deg, #F59E0B, #FFF7E6);
      border-radius: 50%;
      animation: orbit 2s infinite ease-in-out;
      transform-style: preserve-3d;
    }
    #splash .particle-loader .particle:nth-child(2) { animation-delay: 0.2s; }
    #splash .particle-loader .particle:nth-child(3) { animation-delay: 0.4s; }
    @keyframes orbit {
      0% { transform: rotateX(60deg) rotateY(0deg) translateZ(20px); opacity: 0.5; }
      50% { transform: rotateX(60deg) rotateY(180deg) translateZ(20px); opacity: 1; }
      100% { transform: rotateX(60deg) rotateY(360deg) translateZ(20px); opacity: 0.5; }
    }
    #splash .progress-bar {
      position: absolute;
      bottom: 5%;
      width: 200px;
      height: 4px;
      background: rgba(31, 41, 55, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }
    #splash .progress-bar::before {
      content: '';
      position: absolute;
      width: 50%;
      height: 100%;
      background: #F59E0B;
      animation: progress 3s infinite ease-in-out;
    }
    @keyframes progress {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(200%); }
      100% { transform: translateX(-100%); }
    }
    @media (max-width: 600px) {
      #splash .logo { width: 150px; }
      #splash .app-name { font-size: 2rem; }
      #splash .tagline { font-size: 1rem; }
      #splash .particle-loader { bottom: 15%; }
      #splash .progress-bar { width: 150px; }
    }
  </style>
</head>
<body>
<div id="splash">
  <div class="logo-container">
    <img src="icons/Icon-192.png" alt="جاردينيا توداي" class="logo">
  </div>
  <div class="text-container">
    <div class="app-name">جاردينيا توداي</div>
    <div class="tagline">كل خدماتك في مكان واحد</div>
  </div>
  <div class="particle-loader">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  <div class="progress-bar"></div>
</div>

<script>
  let deferredPrompt;
  let isBeforeInstallPromptSupported = false;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    isBeforeInstallPromptSupported = true;
    console.log(`DEBUG: beforeinstallprompt event fired at ${new Date().toISOString()}`);
  });

  window.triggerInstallPrompt = function() {
    if (isBeforeInstallPromptSupported && deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then((choiceResult) => {
        console.log(`DEBUG: User choice: ${choiceResult.outcome} at ${new Date().toISOString()}`);
        if (choiceResult.outcome === 'accepted') {
          console.log(`DEBUG: User accepted the install prompt at ${new Date().toISOString()}`);
        } else {
          console.log(`DEBUG: User dismissed the install prompt at ${new Date().toISOString()}`);
        }
        deferredPrompt = null;
      });
      return 'prompted';
    } else {
      console.log(`DEBUG: PWA install prompt not supported or no deferred prompt available at ${new Date().toISOString()}`);
      return 'unsupported';
    }
  };

  window.isInstallPromptSupported = function() {
    return isBeforeInstallPromptSupported;
  };

  window.addEventListener('appinstalled', () => {
    console.log(`DEBUG: PWA was installed at ${new Date().toISOString()}`);
  });

  window.matchMedia = window.matchMedia || function() {
    return {
      matches: false,
      addListener: function() {},
      removeListener: function() {}
    };
  };

  window.testFetch = function(url) {
    return new Promise((resolve, reject) => {
      fetch(url, { method: 'GET' })
        .then(response => {
          console.log(`DEBUG: testFetch response: ${response.status} at ${new Date().toISOString()}`);
          resolve({
            ok: response.ok,
            status: response.status,
            statusText: response.statusText
          });
        })
        .catch(error => {
          console.error(`DEBUG: testFetch error: ${error} at ${new Date().toISOString()}`);
          reject(error);
        });
    });
  };

  // Load flutter_bootstrap.js with error handling and retry logic (باستخدام مسار نسبي)
  window.addEventListener('load', () => {
    async function loadFlutterBootstrap(attempt = 1, maxAttempts = 3) {
      try {
        await loadScript('flutter_bootstrap.js');
      } catch (error) {
        console.error(`DEBUG: Error loading flutter_bootstrap.js (attempt ${attempt}): ${error} at ${new Date().toISOString()}`);
        if (attempt < maxAttempts) {
          console.log(`DEBUG: Retrying flutter_bootstrap.js load (attempt ${attempt + 1}) at ${new Date().toISOString()}`);
          setTimeout(() => loadFlutterBootstrap(attempt + 1, maxAttempts), 2000);
          return;
        }
        const splash = document.getElementById('splash');
        if (splash) {
          splash.innerHTML = `
            <div style="text-align: center; color: white; direction: rtl;">
              <p style="font-family: 'Cairo', sans-serif; font-size: 24px; font-weight: bold;">فشل تحميل التطبيق</p>
              <p style="font-family: 'Cairo', sans-serif; font-size: 16px; margin: 8px 0;">خطأ في تحميل الموارد</p>
              <button onclick="window.location.reload()" style="padding: 10px 20px; background: #F59E0B; border: none; border-radius: 5px; color: white; font-family: 'Cairo', sans-serif; font-size: 16px;">إعادة المحاولة</button>
            </div>
          `;
        }
      }
    }
    loadFlutterBootstrap();
  });

  console.log(`DEBUG: Base href set to: ${document.getElementsByTagName('base')[0]?.href} at ${new Date().toISOString()}`);
</script>
</body>
</html>
